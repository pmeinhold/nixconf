[bar.default]
margin_ends = 0
radius = 0

[dock]
auto_hide = true
enabled = true
reserve_space = false
show_instance_count = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1720.0
    cy = 1321.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"

[wallpaper]
directory = "/home/paulm/dev/nixconf/pics"
enabled = false
fill_mode = "fit"

    [wallpaper.default]
    path = "/nix/store/1wjl2g3zc54jz5cplfl3qpmf3ksws1dk-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/1wjl2g3zc54jz5cplfl3qpmf3ksws1dk-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"
